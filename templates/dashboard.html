<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.2em;
        }
        .logout {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .logout:hover {
            background: rgba(255,255,255,0.3);
        }
        .total-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        .total-box h3 {
            color: #333;
            font-size: 1.5em;
        }
        #totalSpending {
            color: #667eea;
            font-weight: bold;
        }
        .menu {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .menu h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .menu-item {
            background: #667eea;
            color: white;
            padding: 20px;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s;
            display: block;
        }
        .menu-item:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Dashboard</h1>
        <p>Welcome, {{ username }}!</p>
        <a href="{{ url_for('index') }}" class="logout">Logout</a>
    </div>
    
    <div class="total-box">
        <h3>Total Spending: $<span id="totalSpending">Loading...</span></h3>
    </div>
    
    <div class="menu">
        <h2>Menu</h2>
        <div class="menu-grid">
            <a href="{{ url_for('add_expense') }}" class="menu-item">➕ Add Expense</a>
            <a href="{{ url_for('remove_expense') }}" class="menu-item">🗑️ Remove Expense</a>
            <a href="{{ url_for('view_expenses') }}" class="menu-item">👁️ View Expenses</a>
            <a href="{{ url_for('update_expenses') }}" class="menu-item">✏️ Update Expenses</a>
            <a href="{{ url_for('spending_by_category') }}" class="menu-item">📈 Spending by Category</a>
            <a href="{{ url_for('monthly_trend') }}" class="menu-item">📉 Monthly Trend</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
    function updateTotal() {
        $.ajax({
            url: '/get_total_spending',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                $('#totalSpending').text(data.total.toFixed(2));
            },
            error: function() {
                $('#totalSpending').text('Error');
            }
        });
    }
    updateTotal();
    setInterval(updateTotal, 30000);
    </script>
</body>
</html>
